
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZENTRA</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090914;color:white;font-family:Arial,sans-serif}
header{text-align:center;padding:22px;border-bottom:1px solid #292943}
.logo{font-size:34px;font-weight:900;letter-spacing:6px;color:#a78bfa}
#connection{font-size:12px;color:#aaa;margin-top:6px}
main{max-width:700px;margin:22px auto;padding:12px}
.panel{background:#151528;border:1px solid #303052;border-radius:17px;padding:19px;margin-bottom:15px}
h2{color:#c4b5fd;margin-top:0}
input,select{width:100%;padding:14px;margin:6px 0;background:#090914;border:1px solid #41416a;border-radius:10px;color:white;font-size:16px}
button{padding:13px 16px;border:0;border-radius:10px;background:#7c3aed;color:white;font-weight:bold;cursor:pointer;margin:4px}
button:disabled{opacity:.3}
.full{width:100%}
.secondary{background:#30304d}
.hidden{display:none!important}
.small{color:#aaa;font-size:13px}
#board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cell{aspect-ratio:1;font-size:40px;background:#252541}
.cards{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.card{background:#fff;color:#111;border-radius:9px;padding:12px 9px;font-size:20px;min-width:48px;min-height:65px;border:2px solid #ddd}
.red{color:#dc2626}
.selected{border:3px solid #a78bfa;transform:translateY(-5px)}
.player{padding:10px;background:#24243d;border-radius:9px;margin:6px 0}
.actions{display:flex;flex-wrap:wrap;gap:6px}
#message{color:#c4b5fd;margin:12px 0;min-height:24px}
</style>
</head>
<body>
<header>
 <div class="logo">ZENTRA</div>
 <div id="connection">Підключення...</div>
</header>
<main>
<section id="home">
 <div class="panel">
  <h2>Створити кімнату</h2>
  <input id="name" placeholder="Твоє ім'я" maxlength="20">
  <select id="game">
   <option value="durak">🃏 Дурень</option>
   <option value="mafia">🕵️ Мафія</option>
   <option value="poker">♠️ Покер</option>
   <option value="ttt">❌ Хрестики-нулики</option>
  </select>
  <button class="full" onclick="createRoom()">Створити кімнату</button>
 </div>
 <div class="panel">
  <h2>Приєднатися до кімнати</h2>
  <input id="joinName" placeholder="Твоє ім'я" maxlength="20">
  <input id="roomCode" placeholder="Код кімнати" maxlength="12">
  <button class="full" onclick="joinRoom()">Увійти</button>
 </div>
</section>

<section id="lobby" class="hidden">
 <div class="panel">
  <h2>Кімната ZENTRA</h2>
  <p>Код: <b id="codeDisplay"></b></p>
  <button class="secondary" onclick="copyCode()">Копіювати код</button>
  <h3>Гравці</h3>
  <div id="players"></div>
  <p id="gameInfo" class="small"></p>
  <button class="full" id="startBtn" onclick="startGame()">Почати гру</button>
  <button class="full secondary" onclick="leaveRoom()">Вийти</button>
 </div>
 <div id="gamePanel" class="panel hidden">
  <h2 id="gameTitle">Гра</h2>
  <div id="message"></div>
  <div id="gameContent"></div>
 </div>
</section>
</main>

<script>
const API="https://zentra-1-1322.onrender.com";
const $=id=>document.getElementById(id);
let roomCode="",playerName="",game="",socket=null,state=null,selectedCard=null;

async function api(path,options={}){
 const r=await fetch(API+path,{
  headers:{"Content-Type":"application/json"},
  ...options
 });
 const d=await r.json().catch(()=>({}));
 if(!r.ok)throw Error(d.detail||"Помилка сервера");
 return d;
}

function setStatus(s,color="#4ade80"){
 $("connection").textContent=s;
 $("connection").style.color=color;
}
async function checkAPI(){
 try{await api("/");setStatus("● API підключено")}
 catch(e){setStatus("● Немає зв'язку","#f87171")}
}
checkAPI();

function getName(v){return (v||"").trim().slice(0,20)}

async function createRoom(){
 playerName=getName($("name").value);
 game=$("game").value;
 if(!playerName)return alert("Введи ім'я");
 try{
  const d=await api("/api/rooms",{method:"POST",body:JSON.stringify({
   game,player_name:playerName
  })});
  roomCode=d.code;
  await openLobby();
 }catch(e){alert(e.message)}
}

async function joinRoom(){
 playerName=getName($("joinName").value);
 roomCode=$("roomCode").value.trim().toUpperCase();
 if(!playerName||!roomCode)return alert("Введи ім'я та код");
 try{
  const d=await api("/api/rooms/join",{method:"POST",body:JSON.stringify({
   code:roomCode,player_name:playerName
  })});
  await openLobby();
 }catch(e){alert(e.message)}
}

async function openLobby(){
 $("home").classList.add("hidden");
 $("lobby").classList.remove("hidden");
 $("codeDisplay").textContent=roomCode;
 connect();
 await refresh();
}

function connect(){
 if(socket)socket.close();
 const host=API.replace(/^https?:\/\//,"");
 socket=new WebSocket("wss://"+host+"/ws/"+encodeURIComponent(roomCode)+"?name="+encodeURIComponent(playerName));
 socket.onopen=()=>setStatus("● Онлайн");
 socket.onmessage=e=>{
  const d=JSON.parse(e.data);
  if(d.type==="error"){$("message").textContent=d.message;return}
  if(d.type==="state"){
   state=d;
   game=d.game;
   render();
  }
 };
 socket.onclose=()=>setStatus("● З'єднання закрито","#f87171");
 socket.onerror=()=>setStatus("● Помилка з'єднання","#f87171");
}

async function refresh(){
 try{
  const d=await api("/api/rooms/"+encodeURIComponent(roomCode));
  game=d.game;
  renderPlayers(d);
 }catch(e){console.log(e)}
}

function renderPlayers(d){
 $("players").innerHTML=(d.players||[]).map((p,i)=>
  '<div class="player">'+(p===d.host?"👑 ":"🎮 ")+esc(p)+'</div>'
 ).join("");
 $("gameInfo").textContent="Гра: "+game+" | Гравців: "+d.players.length;
 $("startBtn").disabled=d.started || d.host!==playerName;
 $("startBtn").textContent=d.started?"Гра почалася":"Почати гру";
}

async function startGame(){
 try{
  await api("/api/rooms/"+encodeURIComponent(roomCode)+"/start",{
   method:"POST",body:JSON.stringify({player_name:playerName})
  });
 }catch(e){alert(e.message)}
}

function send(action){
 if(!socket||socket.readyState!==WebSocket.OPEN)return alert("Немає зв'язку");
 socket.send(JSON.stringify(action));
}

function render(){
 if(!state)return;
 const s=state.state||{};
 $("gamePanel").classList.remove("hidden");
 renderPlayers(state);
 $("gameTitle").textContent={
  durak:"🃏 Дурень",mafia:"🕵️ Мафія",
  poker:"♠️ Покер",ttt:"❌ Хрестики-нулики"
 }[game]||"ZENTRA";
 $("message").textContent=s.message||s.winner&&("🏆 Переможець: "+s.winner)||"";
 const content=$("gameContent");
 content.innerHTML="";

 if(game==="durak")renderDurak(s,content);
 if(game==="mafia")renderMafia(s,content);
 if(game==="poker")renderPoker(s,content);
 if(game==="ttt")renderTTT(s,content);
}

function renderTTT(s,el){
 el.innerHTML='<p>Хід: '+esc(s.turn||"")+'</p><div id="board"></div>';
 const board=el.querySelector("#board");
 (s.board||Array(9).fill("")).forEach((v,i)=>{
  const b=document.createElement("button");
  b.className="cell";b.textContent=v;
  b.onclick=()=>send({index:i});
  b.disabled=!!v||!!s.winner||s.draw;
  board.appendChild(b);
 });
 if(s.draw)el.innerHTML+="<h3>Нічия!</h3>";
}

function cardButton(card,click){
 const b=document.createElement("button");
 b.className="card "+("♥♦".includes(card.slice(-1))?"red":"");
 b.textContent=card;
 b.onclick=click;
 return b;
}

function renderDurak(s,el){
 const handInfo=s.hands||{};
 el.innerHTML="<p>Козир: <b>"+esc(s.trump||"")+"</b></p>"+
 "<p>Колода: "+(s.deck_count||0)+" карт</p>"+
 "<p>Атакує: "+esc(s.attacker||"")+" | Захищається: "+esc(s.defender||"")+"</p>"+
 "<p>Карти гравців: "+Object.entries(handInfo).map(([n,c])=>esc(n)+": "+c).join(" · ")+"</p>"+
 "<h3>Стіл</h3><div id='table' class='cards'></div>"+
 "<h3>Твої карти</h3><div id='hand' class='cards'></div>"+
 "<div class='actions'><button onclick=\"send({action:'attack',card:selectedCard})\">Атакувати</button>"+
 "<button onclick=\"send({action:'defend',card:selectedCard})\">Відбити</button>"+
 "<button onclick=\"send({action:'take'})\">Взяти</button>"+
 "<button onclick=\"send({action:'pass'})\">Завершити атаку</button></div>";
 const table=el.querySelector("#table");
 (s.table||[]).forEach(x=>{
  const span=document.createElement("span");
  span.className="card";
  span.textContent=x.attack+" / "+(x.defense||"—");
  table.appendChild(span);
 });
 const hand=el.querySelector("#hand");
 const mine=state.private_hand||[];
 mine.forEach(card=>hand.appendChild(cardButton(card,()=>{
  selectedCard=card;
  render();
 })));
}


function renderMafia(s,el){
 el.innerHTML="";
 const title=document.createElement("h3");
 title.textContent="День "+(s.day||1)+" · "+(s.phase||"");
 el.appendChild(title);

 const role=document.createElement("p");
 role.textContent=state.my_role
  ? "Твоя роль: "+state.my_role
  : "Очікуємо інформацію про твою роль";
 el.appendChild(role);

 (s.players||[]).forEach(p=>{
  const card=document.createElement("div");
  card.className="player";
  card.textContent=p.name+" — "+(p.alive?"🟢 Живий":"💀 Вибув");

  const btn=document.createElement("button");
  btn.textContent="Обрати";
  btn.onclick=()=>{
   window.mafiaTarget=p.name;
   $("message").textContent="Обрано: "+p.name;
  };
  card.appendChild(btn);
  el.appendChild(card);
 });

 const sendBtn=document.createElement("button");
 sendBtn.textContent="Відправити дію";
 sendBtn.onclick=sendMafia;
 el.appendChild(sendBtn);
 window.mafiaTarget=null;
}

function mafiaAction(name){
 window.mafiaTarget=name;
}

function sendMafia(){
 if(!window.mafiaTarget)return alert("Спочатку обери гравця");
 const phase=state.state.phase;
 send({action:phase==="night"?"night":"vote",target:window.mafiaTarget});
}

function mafiaAction(name){
 window.mafiaTarget=name;
 $("message").textContent="Обрано: "+name;
}
function sendMafia(){
 if(!window.mafiaTarget)return alert("Спочатку обери гравця");
 const phase=state.state.phase;
 send({action:phase==="night"?"night":"vote",target:window.mafiaTarget});
}
n 

function renderPoker(s,el){
 el.innerHTML="";

 const pot=document.createElement("p");
 pot.textContent="Банк: "+(s.pot||0)+" фішок";
 el.appendChild(pot);

 const community=document.createElement("div");
 community.className="cards";
 (s.community||[]).forEach(c=>{
  community.appendChild(cardButton(c,()=>{}));
 });
 el.appendChild(community);

 const title=document.createElement("h3");
 title.textContent="Гравці";
 el.appendChild(title);

 (s.players||[]).forEach(p=>{
  const div=document.createElement("div");
  div.className="player";
  div.textContent=p.name+" — "+p.chips+" фішок "+(p.folded?"(пас)":"");
  el.appendChild(div);
 });

 const cardsTitle=document.createElement("h3");
 cardsTitle.textContent="Твої карти";
 el.appendChild(cardsTitle);

 const myCards=document.createElement("div");
 myCards.className="cards";
 (s.my_cards||[]).forEach(c=>{
  myCards.appendChild(cardButton(c,()=>{}));
 });
 el.appendChild(myCards);

 const actions=document.createElement("div");
 actions.className="actions";

 [
  ["Чек",{action:"check"}],
  ["Зрівняти",{action:"call"}],
  ["Пас",{action:"fold"}]
 ].forEach(([label,data])=>{
  const b=document.createElement("button");
  b.textContent=label;
  b.onclick=()=>send(data);
  actions.appendChild(b);
 });

 const raise=document.createElement("button");
 raise.textContent="Підняти";
 raise.onclick=raiseBet;
 actions.appendChild(raise);
 el.appendChild(actions);

 const turn=document.createElement("p");
 turn.textContent="Хід: "+(s.turn||"");
 el.appendChild(turn);
}


function raiseBet(){
 const amount=Number(prompt("На скільки підняти ставку?", "50"));
 if(Number.isInteger(amount)&&amount>0)send({action:"raise",amount});
}

function esc(v){
 return String(v??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function copyCode(){
 navigator.clipboard.writeText(roomCode).then(()=>alert("Код скопійовано"));
}

function leaveRoom(){
 if(socket)socket.close();
 socket=null;state=null;roomCode="";
 $("lobby").classList.add("hidden");
 $("gamePanel").classList.add("hidden");
 $("home").classList.remove("hidden");
}
</script>
</body>
</html>
