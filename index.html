
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZENTRA</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090914;color:#fff;font-family:Arial,sans-serif}
header{padding:22px;text-align:center;border-bottom:1px solid #292943}
.logo{font-size:32px;font-weight:900;letter-spacing:5px;color:#a78bfa}
.status{font-size:12px;color:#9ca3af;margin-top:7px}
main{max-width:650px;margin:25px auto;padding:15px}
.panel{background:#151528;border:1px solid #303052;border-radius:18px;padding:20px;margin-bottom:16px}
h2{margin-top:0;color:#c4b5fd}
input,select{width:100%;padding:14px;margin:7px 0;background:#090914;border:1px solid #41416a;border-radius:10px;color:white;font-size:16px}
button{padding:14px;border:0;border-radius:11px;background:#7c3aed;color:white;font-weight:bold;font-size:15px;cursor:pointer;margin:5px 0}
button:hover{background:#6d28d9}
button:disabled{opacity:.35;cursor:not-allowed}
.full{width:100%}
.secondary{background:#30304d}
.hidden{display:none!important}
#board{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:18px}
.cell{aspect-ratio:1;background:#24243d;border:1px solid #55557b;border-radius:13px;font-size:42px;font-weight:bold;color:#c4b5fd}
.players{color:#c4b5fd;line-height:1.8}
#message{color:#a78bfa;min-height:24px;margin-top:12px}
.small{color:#aaa;font-size:13px}
</style>
</head>
<body>
<header>
 <div class="logo">ZENTRA</div>
 <div class="status" id="connection">Підключення...</div>
</header>

<main>
<section id="home">
 <div class="panel">
  <h2>Створити кімнату</h2>
  <input id="name" placeholder="Твоє ім'я" maxlength="20">
  <select id="game">
   <option value="ttt">❌ Хрестики-нулики</option>
   <option value="mafia">🕵️ Мафія (лобі)</option>
   <option value="durak">🃏 Дурень (лобі)</option>
   <option value="poker">♠️ Покер (лобі)</option>
  </select>
  <button class="full" onclick="createRoom()">Створити кімнату</button>
 </div>

 <div class="panel">
  <h2>Приєднатися</h2>
  <input id="joinName" placeholder="Твоє ім'я" maxlength="20">
  <input id="roomCode" placeholder="Код кімнати" maxlength="12">
  <button class="full" onclick="joinRoom()">Увійти в кімнату</button>
 </div>
</section>

<section id="lobby" class="hidden">
 <div class="panel">
  <h2>Кімната ZENTRA</h2>
  <p>Код кімнати: <strong id="codeDisplay"></strong></p>
  <button class="secondary" onclick="copyCode()">Скопіювати код</button>
  <h3>Гравці</h3>
  <div class="players" id="players">Очікування...</div>
  <p class="small" id="gameInfo"></p>
  <button class="full" id="startBtn" onclick="startGame()">Почати гру</button>
  <button class="full secondary" onclick="leaveRoom()">Вийти з кімнати</button>
 </div>
 <div class="panel hidden" id="gamePanel">
  <h2>❌ Хрестики-нулики</h2>
  <div id="turnInfo">Очікування гравців...</div>
  <div id="board"></div>
  <div id="message"></div>
 </div>
</section>
</main>

<script>
const API = "https://zentra-1-1322.onrender.com";

let roomCode = "";
let playerName = "";
let socket = null;
let currentGame = "";
let latestState = null;

const $ = id => document.getElementById(id);

async function request(path, options={}) {
 const response = await fetch(API + path, {
  headers: {"Content-Type":"application/json"},
  ...options
 });
 const data = await response.json().catch(()=>({}));
 if (!response.ok) throw new Error(data.detail || "Помилка сервера");
 return data;
}

async function checkAPI(){
 try{
  await request("/");
  $("connection").textContent = "● API підключено";
  $("connection").style.color = "#4ade80";
 }catch(e){
  $("connection").textContent = "● Немає зв'язку з API";
  $("connection").style.color = "#f87171";
 }
}
checkAPI();

function getName(value){
 return (value || "").trim().slice(0,20);
}

async function createRoom(){
 playerName = getName($("name").value);
 currentGame = $("game").value;

 if(!playerName) return alert("Введи своє ім'я");

 try{
  const data = await request("/api/rooms",{
   method:"POST",
   body:JSON.stringify({
    game:currentGame,
    player_name:playerName,
    private:false,
    max_players:2
   })
  });
  roomCode = data.code;
  openLobby();
 }catch(e){alert(e.message);}
}

async function joinRoom(){
 playerName = getName($("joinName").value);
 roomCode = $("roomCode").value.trim().toUpperCase();

 if(!playerName || !roomCode) return alert("Введи ім'я та код кімнати");

 try{
  const data = await request("/api/rooms/join",{
   method:"POST",
   body:JSON.stringify({code:roomCode,player_name:playerName})
  });
  await openLobby();
 }catch(e){alert(e.message);}
}

async function openLobby(){
 $("home").classList.add("hidden");
 $("lobby").classList.remove("hidden");
 $("codeDisplay").textContent = roomCode;
 connectSocket();
 await refreshRoom();
}

function connectSocket(){
 if(socket) socket.close();

 const protocol = API.startsWith("https") ? "wss://" : "ws://";
 const host = API.replace(/^https?:\/\//,"");

 socket = new WebSocket(
  protocol + host + "/ws/" + encodeURIComponent(roomCode) +
  "?name=" + encodeURIComponent(playerName)
 );

 socket.onopen = ()=>{
  $("connection").textContent = "● Онлайн";
  $("connection").style.color = "#4ade80";
 };

 socket.onmessage = event=>{
  try{
   const data = JSON.parse(event.data);
   if(data.type === "state"){
    latestState = data;
    renderState(data);
   }else{
    refreshRoom();
   }
  }catch(e){console.log(e);}
 };

 socket.onclose = ()=>{
  $("connection").textContent = "● З'єднання закрито";
  $("connection").style.color = "#f87171";
 };

 socket.onerror = ()=>console.log("WebSocket error");
}

async function refreshRoom(){
 try{
  const data = await request("/api/rooms/" + encodeURIComponent(roomCode));
  currentGame = data.game || currentGame;

  $("players").innerHTML = (data.players || [])
   .map((p,i)=>`${i===0?"👑":"🎮"} ${escapeHTML(typeof p==="string"?p:p.name || "Гравець")}`)
   .join("<br>") || "Поки немає гравців";

  $("gameInfo").textContent = "Гра: " + currentGame;
  $("startBtn").disabled = currentGame !== "ttt" || (data.players || []).length < 2;
  $("startBtn").textContent = currentGame === "ttt"
   ? "Почати гру"
   : "Ця гра ще готується";

 }catch(e){console.log(e);}
}

async function startGame(){
 if(currentGame !== "ttt") return;
 try{
  await request("/api/rooms/" + encodeURIComponent(roomCode) + "/start",{
   method:"POST",
   body:JSON.stringify({player_name:playerName})
  });
  await refreshRoom();
 }catch(e){alert(e.message);}
}

function renderState(data){
 const state = data.state || data;
 const board = state.board || data.board || Array(9).fill("");

 if(currentGame === "ttt" || state.game === "ttt"){
  $("gamePanel").classList.remove("hidden");
  $("board").innerHTML = "";

  for(let i=0;i<9;i++){
   const cell = document.createElement("button");
   cell.className = "cell";
   cell.textContent = board[i] || "";
   cell.disabled = !!board[i] || !!state.winner || !!state.draw;
   cell.onclick = ()=>makeMove(i);
   $("board").appendChild(cell);
  }

  $("turnInfo").textContent = state.turn
   ? "Хід: " + state.turn
   : "Гра триває";

  $("message").textContent = state.winner
   ? "🏆 Переможець: " + state.winner
   : state.draw ? "🤝 Нічия!" : "";
 }
 refreshRoom();
}

function makeMove(index){
 if(!socket || socket.readyState !== WebSocket.OPEN){
  return alert("Немає з'єднання з кімнатою");
 }
 socket.send(JSON.stringify({index:index}));
}

function copyCode(){
 navigator.clipboard.writeText(roomCode)
  .then(()=>alert("Код скопійовано!"))
  .catch(()=>alert("Код кімнати: " + roomCode));
}

function leaveRoom(){
 if(socket) socket.close();
 socket = null;
 roomCode = "";
 latestState = null;
 $("lobby").classList.add("hidden");
 $("gamePanel").classList.add("hidden");
 $("home").classList.remove("hidden");
}

function escapeHTML(value){
 return String(value).replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 }[c]));
}
</script>
</body>
</html>
